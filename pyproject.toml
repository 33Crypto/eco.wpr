[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "private-market-monitor"
version = "0.1.0"
description = "A private command-line monitor for public Coinbase market prices"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
market-monitor = "market_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
